name: Deploy (SSH)

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Preflight - variaveis e rede
        shell: bash
        run: |
          set -euxo pipefail
          echo "Host definido? ${SSH_HOST:+sim}"
          echo "Usuario definido? ${SSH_USER:+sim}"
          echo "Porta definida? ${SSH_PORT:+sim}"
          echo "Chave definida? ${SSH_KEY:+sim}"
          echo "Resolvendo host..."
          getent hosts "${SSH_HOST}" || true
          echo "Teste TCP na porta..."
          nc -vz -w 5 "${SSH_HOST}" "${SSH_PORT}" || true
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_KEY }}
          script: /home/projetos/deploy.sh
          debug: true
